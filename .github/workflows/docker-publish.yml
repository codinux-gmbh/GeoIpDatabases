name: Build and Push Quarkus Native Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract project version
        id: get_version
        run: |
          VERSION=$(grep "^\s*version\s*=\s*" build.gradle.kts | head -n 1 | sed -E 's/\s*version\s*=\s*"(.*)"/\1/')
          echo "version=$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check version is not SNAPSHOT
        if: endsWith(steps.get_version.outputs.version, '-SNAPSHOT')
        run: |
          echo "Version is SNAPSHOT, skipping publish."
          exit 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Build Quarkus native app
        run: ./gradlew GeoIpAPI:build -Dquarkus.native.enabled=true -Dquarkus.package.jar.enabled=false -Dquarkus.native.container-build=true -x test

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./GeoIpAPI
          file: GeoIpAPI/src/main/docker/Dockerfile.native-micro
          push: true
          tags: ghcr.io/codinux-gmbh/geoip:${{ steps.get_version.outputs.version }}
